[build]
  command = "npm run build"
  publish = "_site"

[[redirects]]
  from = "/bathroom-renovations-gloucester/"
  to = "/bathroom-renovation-gloucester/"
  status = 301
  force = true

[[redirects]]
  from = "/bathroom-renovations-gloucester"
  to = "/bathroom-renovation-gloucester/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

